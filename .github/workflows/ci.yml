# Node image CI from the central workflows; see CodeClarityCE/.github.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    uses: CodeClarityCE/.github/.github/workflows/node-image.yml@ci/102-node-image
    # Release jobs only; they run on main when CI_RELEASE is true.
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      test-command: pnpm test
      # Contract e2e tests need no database or services, as in the Jenkinsfile.
      extra-test-command: pnpm test:e2e test/integration/*contract*.e2e-spec.ts

  # The required check, kept here because called jobs show as "node / <job>".
  ci:
    needs: [node]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULT: ${{ needs.node.result }}
        run: '[[ "$RESULT" == success ]] || { echo "::error::node did not succeed: $RESULT"; exit 1; }'
